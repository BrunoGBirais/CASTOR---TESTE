# ================================================================
#  deploy-n8n.yml
#  Quando um PR é mergeado no main (= push no main): compila o front
#  React num HTML único dentro de Castor-Front.json e sobe os workflows
#  de castor-agent/workspaces para o n8n. Sem migrations — para isso,
#  use o deploy.yml manual.
# ================================================================
#
#  Local equivalente:
#    node deploy/run.mjs clean front n8n
#
#  Environment do GitHub: "TESTE ORACLE" (Settings → Environments)
#
#  Obrigatórios (2):
#    N8N_URL      variável ou secret do environment
#    N8N_API_KEY  SECRET do environment — nunca variável: o repo é público
#                 e variáveis aparecem sem máscara no log
#
#  Opcionais (variável ou secret) — o front usa os defaults do src/config
#  quando faltam:
#    SUPABASE_URL, SUPABASE_ANON_KEY (a anon, nunca a service_role)
#    API_BASE    → sobrescreve N8N_URL + "/webhook"
#
#  Secrets opcionais:
#    N8N_EMAIL + N8N_PASSWORD    → listar credenciais e criar/mover pastas
#    N8N_CREDENTIAL_IDS          → mapa nome→id, alternativa ao login
#    N8N_COOKIE + N8N_BROWSER_ID → cookie n8n-auth já pronto
#    N8N_PROJECT_ID              → default "personal"
# ================================================================

name: Deploy n8n

on:
  push:
    branches: [main]
    paths:
      - "castor-agent/workspaces/**"
      - "castor-agent/front-react/**"
      - "deploy/deploy-n8n.mjs"
      - "deploy/build-front.mjs"
      - "deploy/lib/**"
      - ".scripts/sync-n8n.mjs"
      - ".scripts/build-static-workflow.mjs"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (não escreve no n8n)"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.repository }}-deploy
  cancel-in-progress: false

jobs:
  deploy-n8n:
    name: "Workflows → n8n"
    runs-on: ubuntu-latest
    environment: TESTE ORACLE
    permissions:
      contents: read
    env:
      N8N_URL: ${{ vars.N8N_URL || secrets.N8N_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      N8N_EMAIL: ${{ secrets.N8N_EMAIL }}
      N8N_PASSWORD: ${{ secrets.N8N_PASSWORD }}
      N8N_COOKIE: ${{ secrets.N8N_COOKIE }}
      N8N_BROWSER_ID: ${{ secrets.N8N_BROWSER_ID }}
      N8N_PROJECT_ID: ${{ secrets.N8N_PROJECT_ID }}
      N8N_CREDENTIAL_IDS: ${{ secrets.N8N_CREDENTIAL_IDS }}
      # ── Front ── (as VITE_* saem daqui em deploy/build-front.mjs)
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      API_BASE: ${{ vars.API_BASE || secrets.API_BASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Conferir secrets obrigatórios
        run: |
          missing=""
          for v in N8N_URL N8N_API_KEY; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "✖ secrets faltando:$missing"
            exit 1
          fi
          echo "✓ secrets obrigatórios presentes"

      # Nenhum JSON pode chegar ao n8n com id de credencial ou identidade
      # de instância. Correção: node deploy/clean-credentials.mjs
      - name: Verificar credenciais
        run: node deploy/clean-credentials.mjs --check

      # React → HTML único → nó HTML de Castor-Front.json, com as URLs deste
      # ambiente. O JSON gerado só vale para este deploy: não volta ao Git.
      - name: Build do front
        run: node deploy/build-front.mjs

      - name: Subir workflows
        run: node deploy/deploy-n8n.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Deploy n8n"
            echo ""
            echo "| Item | Valor |"
            echo "|------|-------|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Dry-run | \`${{ inputs.dry_run || false }}\` |"
            echo "| Status | ${{ job.status }} |"
          } >> $GITHUB_STEP_SUMMARY
