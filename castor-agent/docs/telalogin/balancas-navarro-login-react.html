<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Navarro — Entrar (React)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ─────────────────────────────────────────────────────────────
   * Tokens extraídos de navarro.com.br (index-*.css, custom
   * properties --navarro-*). Ver brand-spec.md para conversão
   * HSL → hex/OKLch e evidências. Fonte real: Poppins.
   * ───────────────────────────────────────────────────────────── */
  :root{
    --bg:#ffffff;
    --surface:#f0f2f4;
    --fg:#212936;
    --muted:#637083;
    --meta:#8a94a3;
    --border:#dfe3e7;

    --accent:#b91818;
    --accent-dark:#9e1515;
    --accent-on:#ffffff;
    --accent-soft:#fbeaea;

    --green:#106a31;
    --green-soft:#e7f3ec;
    --danger:#dc2626;

    --hero-bg:#1c2d47;
    --hero-fg:#ffffff;
    --border-hover:#c3cad2;
    --btn-disabled-bg:#d8a3a3;

    --font-display:"Poppins",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-body:"Poppins",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;

    --radius-sm:8px;
    --radius-md:8px;
    --radius-lg:14px;

    --shadow-card:0 4px 20px -4px rgba(33,41,54,.10);
    --shadow-card-hover:0 12px 40px -8px rgba(33,41,54,.15);
    --shadow-button:0 4px 14px -2px rgba(185,24,24,.35);

    --motion-fast:150ms;
    --motion-base:200ms;
    --ease-standard:cubic-bezier(.2,0,0,1);
  }

  *{box-sizing:border-box;}
  html,body,#root{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ─── Layout shell ─────────────────────────────────────────── */
  .screen{
    min-height:100vh;
    display:grid;
    grid-template-columns:1.05fr 1fr;
  }

  /* ─── Left: hero / brand panel ────────────────────────────── */
  .hero{
    position:relative;
    overflow:hidden;
    background:var(--hero-bg);
    padding:48px 56px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    color:var(--hero-fg);
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:-20px;
    background-image:url('hero-navarro-galpao-BcRxo_pu.jpg');
    background-size:cover;
    background-position:center;
    filter:blur(14px) saturate(1.05);
    transform:scale(1.08);
    z-index:0;
    pointer-events:none;
  }
  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,color-mix(in srgb,var(--hero-bg) 82%,transparent) 0%,color-mix(in srgb,var(--hero-bg) 68%,transparent) 55%,color-mix(in srgb,var(--hero-bg) 85%,transparent) 100%);
    z-index:0;
    pointer-events:none;
  }

  .hero-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    z-index:1;
  }

  .brand{
    display:flex;
    align-items:center;
  }
  .brand-logo{
    height:56px;
    width:auto;
    display:block;
    background:transparent;
  }

  .hero-tag{
    font-family:var(--font-body);
    font-size:12px;
    font-weight:500;
    letter-spacing:0.04em;
    text-transform:uppercase;
    background:rgba(255,255,255,.14);
    color:var(--hero-fg);
    padding:8px 16px;
    border-radius:var(--radius-sm);
  }

  .hero-mid{
    max-width:520px;
    margin-top:40px;
    position:relative;
    z-index:1;
  }
  .hero-eyebrow{
    font-family:var(--font-body);
    font-size:12px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:rgba(255,255,255,.78);
    margin:0 0 20px;
  }
  .hero-title-intro{
    font-family:var(--font-body);
    font-weight:400;
    font-size:19px;
    line-height:1.4;
    color:rgba(255,255,255,.82);
    margin:0 0 6px;
  }
  .hero-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:46px;
    line-height:1.08;
    letter-spacing:-0.01em;
    color:var(--hero-fg);
    margin:0 0 20px;
  }
  .hero-sub{
    font-family:var(--font-body);
    font-weight:400;
    font-size:17px;
    line-height:1.55;
    color:rgba(255,255,255,.86);
    margin:0;
    max-width:440px;
  }

  .hero-features{
    display:flex;
    flex-direction:column;
    gap:18px;
    margin-top:40px;
    position:relative;
    z-index:1;
  }
  .hero-feature{
    display:flex;
    align-items:flex-start;
    gap:14px;
  }
  .hero-feature-icon{
    flex:none;
    width:40px;height:40px;
    border-radius:var(--radius-md);
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;
  }
  .hero-feature-icon svg{width:20px;height:20px;stroke:var(--hero-fg);}
  .hero-feature-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    color:var(--hero-fg);
    margin:0 0 3px;
  }
  .hero-feature-desc{
    font-family:var(--font-body);
    font-weight:400;
    font-size:14px;
    line-height:1.45;
    color:rgba(255,255,255,.78);
    margin:0;
    max-width:360px;
  }

  .hero-bottom{
    font-family:var(--font-body);
    font-size:12px;
    font-weight:400;
    color:rgba(255,255,255,.6);
    margin-top:48px;
    position:relative;
    z-index:1;
  }

  /* ─── Mobile-only brand header (hero is hidden below 960px) ── */
  .mobile-brand{
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:var(--hero-bg);
  }
  .mobile-brand img{
    height:40px;
    width:auto;
    display:block;
  }

  /* ─── Right: form panel ────────────────────────────────────── */
  .panel{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px;
    background:var(--bg);
  }
  .form-wrap{
    width:100%;
    max-width:380px;
  }

  .form-label-mono{
    font-family:var(--font-body);
    font-size:12px;
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 12px;
  }
  .form-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:30px;
    letter-spacing:-0.01em;
    line-height:1.15;
    margin:0 0 36px;
    color:var(--fg);
  }

  .field{margin-bottom:20px;}
  .field label{
    display:block;
    font-family:var(--font-body);
    font-weight:500;
    font-size:14px;
    color:var(--fg);
    margin-bottom:8px;
  }
  .field-input-wrap{position:relative;}
  .field input{
    width:100%;
    font-family:var(--font-body);
    font-weight:400;
    font-size:16px;
    color:var(--fg);
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:13px 16px;
    outline:none;
    transition:border-color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard);
  }
  .field input::placeholder{color:var(--meta);}
  .field input:hover{border-color:var(--border-hover);}
  .field input:focus-visible{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .field-error{
    display:none;
    font-family:var(--font-body);
    font-size:13px;
    color:var(--danger);
    margin-top:6px;
  }
  .field.has-error input{border-color:var(--danger);}
  .field.has-error .field-error{display:block;}

  .toggle-visibility{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    width:32px;height:32px;
    border-radius:6px;
    border:none;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--muted);
  }
  .toggle-visibility:hover{background:var(--surface);color:var(--fg);}
  .toggle-visibility:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .toggle-visibility svg{width:18px;height:18px;}

  .row-between{
    display:flex;
    align-items:center;
    margin-bottom:28px;
  }
  .check-wrap{display:flex;align-items:center;gap:9px;}
  .check-wrap input[type="checkbox"]{
    width:18px;height:18px;
    accent-color:var(--accent);
    cursor:pointer;
  }
  .check-wrap input[type="checkbox"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .check-wrap label{
    font-family:var(--font-body);
    font-size:14px;
    font-weight:400;
    color:var(--muted);
    cursor:pointer;
  }
  .btn-primary{
    width:100%;
    display:flex;align-items:center;justify-content:center;
    gap:8px;
    background:var(--accent);
    color:var(--accent-on);
    font-family:var(--font-body);
    font-weight:600;
    font-size:16px;
    border:none;
    border-radius:var(--radius-sm);
    padding:14px 24px;
    cursor:pointer;
    box-shadow:var(--shadow-button);
    transition:background var(--motion-fast) var(--ease-standard), transform var(--motion-fast);
  }
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-primary:active{transform:translateY(1px);}
  .btn-primary:focus-visible{outline:2px solid var(--fg);outline-offset:3px;}
  .btn-primary[disabled]{background:var(--btn-disabled-bg);box-shadow:none;cursor:not-allowed;}
  .btn-primary svg{width:16px;height:16px;transition:transform var(--motion-fast);}
  .btn-primary:hover svg{transform:translateX(2px);}

  .cert-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin:24px auto 0;
    font-family:var(--font-body);
    font-size:12px;
    font-weight:500;
    color:var(--green);
    background:var(--green-soft);
    padding:6px 12px;
    border-radius:var(--radius-sm);
  }
  .cert-badge svg{width:14px;height:14px;flex:none;}

  .form-copyright{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    margin-top:40px;
  }
  .form-copyright-label{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    letter-spacing:.01em;
  }
  .form-copyright img{
    width:160px;
    height:auto;
    opacity:.7;
  }

  /* ─── Responsive ───────────────────────────────────────────── */
  @media (max-width:960px){
    .screen{grid-template-columns:1fr;}
    .hero{display:none;}
    .mobile-brand{display:flex;}
    .panel{padding:32px 24px;min-height:100vh;}
  }
  @media (max-width:420px){
    .form-title{font-size:24px;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useCallback } = React;

/* ─── Icons (monoline SVG, currentColor / stroke) ───────────── */
function IconBolt() {
  return (
    <svg viewBox="0 0 24 24" fill="none" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
      <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" />
    </svg>
  );
}
function IconSpark() {
  return (
    <svg viewBox="0 0 24 24" fill="none" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
      <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" />
      <circle cx="12" cy="12" r="3.2" />
    </svg>
  );
}
function IconBars() {
  return (
    <svg viewBox="0 0 24 24" fill="none" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
      <path d="M4 20V10M11 20V4M18 20v-7" />
    </svg>
  );
}
function IconEye() {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" />
      <circle cx="12" cy="12" r="3" />
    </svg>
  );
}
function IconArrow() {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M5 12h14M13 6l6 6-6 6" />
    </svg>
  );
}
function IconCheck() {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M20 6 9 17l-5-5" />
    </svg>
  );
}

const HERO_FEATURES = [
  { icon: <IconBolt />, title: "Vantagem Competitiva", desc: "Processos mais rápidos com fluxos inteligentes." },
  { icon: <IconSpark />, title: "Inteligência Artificial", desc: "Impulsionando a produtividade." },
  { icon: <IconBars />, title: "Análises em Tempo Real", desc: "Acompanhe o desempenho com dashboards inteligentes." },
];

function HeroPanel() {
  return (
    <aside className="hero" data-od-id="hero-panel">
      <div className="hero-top">
        <div className="brand" data-od-id="brand-lockup">
          <img className="brand-logo" src="logo-navarro.png" alt="Navarro" />
        </div>
        <div className="hero-tag">Portal do Agente</div>
      </div>

      <div className="hero-mid">
        <p className="hero-eyebrow">Desde 1957</p>
        <p className="hero-title-intro">Bem-vindo de volta ao seu</p>
        <h1 className="hero-title">Agente de I.A.</h1>
        <p className="hero-sub">Acesse suas ferramentas de automação inteligente, painéis de análise e insights — tudo em um só lugar.</p>

        <div className="hero-features" data-od-id="hero-features">
          {HERO_FEATURES.map((f) => (
            <div className="hero-feature" key={f.title}>
              <div className="hero-feature-icon">{f.icon}</div>
              <div>
                <p className="hero-feature-title">{f.title}</p>
                <p className="hero-feature-desc">{f.desc}</p>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="hero-bottom">© 2026 Balanças Navarro Indústria e Comércio — Todos os direitos reservados</div>
    </aside>
  );
}

function MobileBrandHeader() {
  return (
    <header className="mobile-brand" data-od-id="mobile-brand-header">
      <img src="logo-navarro.png" alt="Navarro" />
    </header>
  );
}

function LoginForm() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [remember, setRemember] = useState(false);
  const [showPassword, setShowPassword] = useState(false);
  const [errors, setErrors] = useState({ email: false, password: false });
  const [submitting, setSubmitting] = useState(false);

  const handleSubmit = useCallback((e) => {
    e.preventDefault();
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
    const passOk = password.length >= 8;
    setErrors({ email: !emailOk, password: !passOk });
    if (emailOk && passOk) {
      // Placeholder: wire to real auth endpoint.
      setSubmitting(true);
    }
  }, [email, password]);

  return (
    <main className="panel" data-od-id="form-panel">
      <div className="form-wrap">
        <p className="form-label-mono">Acesso ao painel</p>
        <h2 className="form-title">Entrar na sua conta</h2>

        <form noValidate onSubmit={handleSubmit} data-od-id="login-form">
          <div className={"field" + (errors.email ? " has-error" : "")} data-od-id="field-email">
            <label htmlFor="email">E-mail</label>
            <div className="field-input-wrap">
              <input
                id="email"
                name="email"
                type="email"
                placeholder="voce@empresa.com.br"
                autoComplete="username"
                required
                value={email}
                onChange={(e) => {
                  setEmail(e.target.value);
                  if (errors.email) setErrors((s) => ({ ...s, email: false }));
                }}
              />
            </div>
            <p className="field-error">Informe um e-mail válido.</p>
          </div>

          <div className={"field" + (errors.password ? " has-error" : "")} data-od-id="field-password">
            <label htmlFor="password">Senha</label>
            <div className="field-input-wrap">
              <input
                id="password"
                name="password"
                type={showPassword ? "text" : "password"}
                placeholder="Sua senha"
                autoComplete="current-password"
                required
                value={password}
                onChange={(e) => {
                  setPassword(e.target.value);
                  if (errors.password) setErrors((s) => ({ ...s, password: false }));
                }}
              />
              <button
                type="button"
                className="toggle-visibility"
                aria-label={showPassword ? "Ocultar senha" : "Mostrar senha"}
                data-od-id="toggle-password"
                onClick={() => setShowPassword((v) => !v)}
              >
                <IconEye />
              </button>
            </div>
            <p className="field-error">A senha deve ter ao menos 8 caracteres.</p>
          </div>

          <div className="row-between">
            <div className="check-wrap">
              <input
                type="checkbox"
                id="remember"
                name="remember"
                checked={remember}
                onChange={(e) => setRemember(e.target.checked)}
              />
              <label htmlFor="remember">Manter conectado</label>
            </div>
          </div>

          <button type="submit" className="btn-primary" data-od-id="btn-submit-login" disabled={submitting}>
            {submitting ? "Entrando..." : "Entrar"}
            {!submitting && <IconArrow />}
          </button>
        </form>

        <div className="cert-badge">
          <IconCheck />
          Inovação que transforma
        </div>

        <div className="form-copyright" data-od-id="form-copyright">
          <span className="form-copyright-label">Gerando inovação através de inteligência artificial</span>
          <img src="logo-rodape-jia-sp-1.png" alt="JIA SP" />
        </div>
      </div>
    </main>
  );
}

function App() {
  return (
    <div className="screen" data-od-id="login-screen">
      <HeroPanel />
      <MobileBrandHeader />
      <LoginForm />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
